<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LabLayout</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <div class="sidebar">
        <h1>LabLayout</h1>

        <!-- kasih class creator-link -->
        <a
          href="https://www.instagram.com/prdna.1tr/"
          target="_blank"
          class="creator-link"
        >
          Made by @prdn.1tr →
        </a>

        <label>Upload Images</label>
        <input type="file" id="imageUpload" multiple accept="image/*" />

        <label>Image Width (cm)</label>
        <input type="number" id="imgWidth" value="5" step="0.1" />

        <label>Horizontal Gap (cm)</label>
        <input type="number" id="gapX" value="0.3" step="0.1" />

        <label>Vertical Gap (cm)</label>
        <input type="number" id="gapY" value="0.3" step="0.1" />

        <label>Page Margin (cm)</label>
        <input type="number" id="margin" value="1" step="0.1" />

        <div class="checkbox-row">
          <input type="checkbox" id="keepRatio" checked />
          <span>Keep Aspect Ratio</span>
        </div>

        <button id="downloadBtn">Download PDF</button>
      </div>

      <div class="workspace">
        <div class="nav">
          <button id="prevPage">◀ Prev</button>

          <span id="pageCounter">Page 1 / 1</span>

          <button id="nextPage">Next ▶</button>
        </div>

        <div id="paper">
          <div id="layoutArea"></div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="script.js"></script>
  </body>
</html>
